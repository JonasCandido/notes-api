services:
  postgres:
    image: postgres:15.5
    environment:
      POSTGRES_DB: notesdb
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
    ports:
      - "5432:5432"

  api:
    build: ./backend
    depends_on:
      - postgres

  nginx:
    image: nginx:1.26.1-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - api
